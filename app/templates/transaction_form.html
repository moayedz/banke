{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ 'تعديل معاملة' if tx else 'معاملة جديدة' }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <div class="segmented">
      <label><input type="radio" name="kind" value="expense" {{ 'checked' if not tx or tx.amount < 0 }}><span>مصروف</span></label>
      <label><input type="radio" name="kind" value="income" {{ 'checked' if tx and tx.amount > 0 }}><span>دخل</span></label>
    </div>
    <label>المبلغ<input name="amount" inputmode="decimal" required autofocus value="{{ '%.2f'|format(tx.amount|abs) if tx }}" dir="ltr"></label>
    <label>الحساب
      <select name="account_id">{% for a in accounts %}<option value="{{ a.id }}" {{ 'selected' if tx and tx.account_id == a.id }}>{{ a.name }} ({{ a.currency }})</option>{% endfor %}</select>
    </label>
    <label>التاريخ<input type="date" name="tx_date" value="{{ today }}" required></label>
    <label>الوصف<input name="description" value="{{ tx.description if tx }}" placeholder="مثلًا: Migros"></label>
    <label>الفئة
      <select name="category_id">
        <option value="">{{ 'بدون تصنيف' if tx else 'تلقائي (حسب الوصف)' }}</option>
        <optgroup label="مصاريف">{% for c in categories if c.kind == 'expense' %}<option value="{{ c.id }}" {{ 'selected' if tx and tx.category_id == c.id }}>{{ c.name }}</option>{% endfor %}</optgroup>
        <optgroup label="دخل">{% for c in categories if c.kind == 'income' %}<option value="{{ c.id }}" {{ 'selected' if tx and tx.category_id == c.id }}>{{ c.name }}</option>{% endfor %}</optgroup>
      </select>
    </label>
    {% if tx %}
    <label>تذكّر: أي وصف فيه هالكلمة يروح لهالفئة (اختياري)
      <input name="remember_keyword" placeholder="{{ suggestion }}" dir="ltr">
    </label>
    {% endif %}
    <label>ملاحظة<input name="note" value="{{ tx.note if tx }}"></label>
    <button>حفظ</button>
  </form>
  {% if tx %}
  <form method="post" action="/transactions/{{ tx.id }}/delete" onsubmit="return confirm('متأكد بدك تحذفها؟')">
    <button class="danger">حذف</button>
  </form>
  {% endif %}
</section>
{% endblock %}
